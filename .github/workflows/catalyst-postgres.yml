name: Catalyst PostgreSQL

on:
  pull_request:
    branches: [main]
    paths:
      - platform/catalyst-doot/**
      - platform/ingestion/**
      - .github/workflows/catalyst-postgres.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wtf_catalyst_test
          POSTGRES_USER: wtf
          # Ephemeral CI service only; no company database or credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U wtf -d wtf_catalyst_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      WTF_DATABASE_URL: postgresql+psycopg://wtf@127.0.0.1:5432/wtf_catalyst_test
      CATALYST_TEST_DATABASE_URL: postgresql+psycopg://wtf@127.0.0.1:5432/wtf_catalyst_test
      WTF_ENABLE_LIVE_SEC: "false"
      WTF_ENABLE_LIVE_IR: "false"
      WTF_ENABLE_LIVE_ALPACA: "false"
      WTF_DASHBOARD_MODE: fixture
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Install locked Python 3.12 dependencies
        working-directory: platform/catalyst-doot
        run: uv sync --locked --extra dev --python 3.12
      - name: Apply ingestion migrations
        working-directory: platform/ingestion
        run: ../catalyst-doot/.venv/bin/alembic upgrade head
      - name: Check PostgreSQL views and dashboard contracts
        working-directory: platform/catalyst-doot
        run: uv run --locked pytest --junitxml=pytest-postgres.xml
